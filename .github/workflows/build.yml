name: Build Windows EXE & Linux Binary

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build MathNoteStudio.exe
        run: |
          pyinstaller --noconfirm --windowed --onefile --name "MathNoteStudio" --add-data "assets;assets" --collect-all fitz main.py
      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathNoteStudio-Windows-EXE
          path: dist/MathNoteStudio.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build MathNoteStudio Linux Binary
        run: |
          pyinstaller --noconfirm --windowed --onefile --name "MathNoteStudio-Linux" --add-data "assets:assets" --collect-all fitz main.py
      - name: Upload Linux Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathNoteStudio-Linux
          path: dist/MathNoteStudio-Linux

  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: MathNoteStudio-Windows-EXE
          path: release_files
      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: MathNoteStudio-Linux
          path: release_files
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "MathNote Studio v1.0.0 (Windows .EXE & Linux)"
          body: |
            ### 📥 Tải về MathNote Studio (Bản chạy độc lập không cần cài Python)
            - 🪟 **Dành cho Windows 10/11:** Tải file **`MathNoteStudio.exe`** bên dưới và nhấp đúp để mở ngay.
            - 🐧 **Dành cho Linux:** Tải file **`MathNoteStudio-Linux`** bên dưới (`chmod +x MathNoteStudio-Linux && ./MathNoteStudio-Linux`).
            - 🔑 **Kết nối Google AI:** Khi mở ứng dụng lần đầu, bấm nút **Lấy Mã 1-Click** để kết nối tài khoản Gmail/Google AI miễn phí trong 15 giây.
          files: |
            release_files/MathNoteStudio.exe
            release_files/MathNoteStudio-Linux
          draft: false
          prerelease: false
